# ============================================================
# PersonalKD Docker Compose
# 一键启动: docker-compose up -d
# 完整系统: Qdrant (向量数据库) + Backend (FastAPI + 前端静态文件)
# ============================================================

services:
  # ---------- 向量数据库 ----------
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------- 后端服务 (FastAPI + 前端静态文件) ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # 从 backend/.env 读取环境变量（pydantic-settings 需要）
    env_file:
      - ./backend/.env
    # 覆盖 .env 中的 Qdrant 地址，使用 Docker 内部网络
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      # 持久化数据目录（知识库、上传文件、BM25索引、SQLite、日志）
      - ./data:/app/backend/data
      # 挂载模型目录（reranker 模型，避免每次构建都下载）
      - ./backend/models:/app/backend/models
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
