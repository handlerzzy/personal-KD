[project]
name = "kb-agent"
version = "0.1.0"
description = "基于 LangGraph 的个人知识库问答系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.3.0",
    "langchain-community",
    "langchain-qdrant",
    "qdrant-client>=1.13.0",
    "zhipuai>=2.0.0",
    "rank_bm25>=0.2.2",
    "jieba>=0.42.1",
    "transformers>=4.45.0",
    "torch>=2.0.0",
    "sentencepiece",
    "python-multipart",
    "langchain-openai>=0.3.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "aiosqlite>=0.22.1",
    "langchain-mineru>=0.1.0",
    "mineru-open-sdk>=0.2.0",
    "langsmith>=0.8.7",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    "email-validator>=2.0.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
