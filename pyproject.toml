[project]
name = "kb-agent"
version = "0.1.0"
description = "基于 LangGraph 的个人知识库问答系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic>=2.0",
    "pydantic-settings",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.3.0",
    "langchain-community",
    "langchain-qdrant",
    "qdrant-client>=1.13.0",
    "zhipuai>=2.0.0",
    "bm25x>=0.3.0",
    "transformers>=4.45.0",
    "torch>=2.0.0",
    "sentencepiece",
    "modelscope>=0.3.0",
    "python-multipart",
    "aiofiles",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
