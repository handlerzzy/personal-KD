name: CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --group dev

      - name: Create dummy .env for pydantic-settings
        run: |
          cat > backend/.env << 'EOF'
          ZHIPU_API_KEY=dummy
          LLM_API_BASE=http://localhost:11434/v1
          LLM_API_KEY=dummy
          LLM_MODEL=mimo-v2.5
          DASHSCOPE_API_KEY=dummy
          QDRANT_URL=http://localhost:6333
          SECRET_KEY=ci-test-secret-key-not-for-production
          EOF

      - name: Lint with ruff
        run: uv run ruff check backend/

      - name: Run backend tests
        run: uv run pytest backend/tests/ -v --tb=short
        env:
          # Ensure tests don't try to connect to real services
          ZHIPU_API_KEY: dummy
          LLM_API_BASE: http://localhost:11434/v1
          LLM_API_KEY: dummy
          LLM_MODEL: mimo-v2.5
          DASHSCOPE_API_KEY: dummy
          QDRANT_URL: http://localhost:6333

  frontend-build:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check & build
        run: npm run build
        working-directory: frontend

      - name: Lint with eslint
        run: npx eslint .
        working-directory: frontend
